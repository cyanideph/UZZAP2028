name: Android Build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Expo configuration
        run: pnpm exec expo config --type public

      - name: Assemble Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Android runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.cyanideph.uzzap2028
            adb shell monkey -p com.cyanideph.uzzap2028 1
            sleep 8
            adb shell uiautomator dump /sdcard/window.xml
            adb shell cat /sdcard/window.xml | grep -q "UZZAP"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: uzzap2028-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
