name: Android Build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Android Unit Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

  build:
    name: Android Standalone APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Expo configuration
        run: pnpm exec expo config --type public

      - name: Generate native Android project from Expo config
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble standalone debug-optimized APK
        working-directory: android
        run: ./gradlew assembleDebugOptimized --no-daemon --build-cache

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: uzzap2028-standalone-apk
          path: android/app/build/outputs/apk/debugOptimized/app-debugOptimized.apk
          if-no-files-found: error
          retention-days: 7
