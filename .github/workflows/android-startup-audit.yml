name: Android Startup Audit

on:
  pull_request:
    branches:
      - main

concurrency:
  group: android-startup-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  startup-audit:
    name: Android Startup & Native Resource Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Expo configuration
        run: pnpm exec expo config --type public

      - name: Generate clean Android native project
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Audit Android startup resources and branding
        run: pnpm run test:android-startup

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Android lint
        working-directory: android
        run: ./gradlew lintDebug --no-daemon
