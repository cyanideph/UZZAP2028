name: Prettier Bulk Format

on:
  push:
    branches:
      - chore/prettier-format

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Prepare
        uses: ./.github/composite-actions/prepare

      - name: Format
        run: pnpm run format

      - name: Verify
        run: pnpm run format:check

      - name: Package formatted source
        run: |
          mkdir -p /tmp/uzzap2028-formatted
          tar -czf /tmp/uzzap2028-formatted/source.tar.gz src __tests__

      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: uzzap2028-prettier-formatted
          path: /tmp/uzzap2028-formatted/source.tar.gz
