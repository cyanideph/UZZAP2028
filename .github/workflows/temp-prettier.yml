name: Temporary Prettier Extraction

on:
  push:
    branches:
      - fix/pr3-ci-integration

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier src/context/stripe-context.tsx --write
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-stripe
          path: src/context/stripe-context.tsx
