# Maestro configuration for UZZAP2028
defaultTimeout: 10000
extendedTimeout: 30000
animationSpeed: 1.0

screenshots:
  enabled: true
  path: ./e2e/maestro/screenshots
  onFailure: true
  onSuccess: false

debug:
  enabled: false
  outputPath: ./e2e/maestro/debug

env:
  TEST_EMAIL: ${TEST_EMAIL}
  TEST_PASSWORD: ${TEST_PASSWORD}
  TEST_USER_NAME: ${TEST_USER_NAME:-E2E Test User}

ios:
  device: ${IOS_DEVICE:-iPhone 15}
  osVersion: ${IOS_VERSION:-17.0}
  appId: com.cyanideph.uzzap2028
  eraseSimulator: false
  headless: true

android:
  device: ${ANDROID_DEVICE:-emulator-5554}
  appId: com.cyanideph.uzzap2028
  eraseEmulator: false
  headless: true

execution:
  parallel: false
  workers: 1
  failFast: true
  continueOnFailure: false
