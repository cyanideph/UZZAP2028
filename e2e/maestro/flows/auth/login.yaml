appId: com.cyanideph.uzzap2028
name: Authentication - Login Flow
tags:
  - auth
  - critical
  - smoke

---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: 'Sign In'
    timeout: 15000

- tapOn: 'Sign In'

- extendedWaitUntil:
    visible: 'Email'
    timeout: 10000

- tapOn:
    id: 'auth-email-input'
- inputText: ${TEST_EMAIL}

- tapOn:
    id: 'auth-password-input'
- inputText: ${TEST_PASSWORD}

- hideKeyboard
- tapOn:
    id: 'auth-signin-button'

- extendedWaitUntil:
    visible: 'Discover'
    timeout: 30000

- assertVisible: 'Discover'
- assertVisible: 'Communities'
- assertVisible: 'Chat'
- assertVisible: 'Profile'

- tapOn:
    text: 'Profile'
    index: 0

- extendedWaitUntil:
    visible: 'Profile'
    timeout: 10000
- assertVisible: 'Profile'
