appId: com.cyanideph.uzzap2028
name: Navigation - Tab Switching
tags:
  - navigation
  - smoke

---
- launchApp:
    clearState: true

- runFlow: ../auth/login.yaml

- tapOn:
    text: 'Home'
    index: 0
- extendedWaitUntil:
    visible: 'Discover'
    timeout: 10000
- assertVisible: 'Discover'

- tapOn:
    text: 'Communities'
    index: 0
- extendedWaitUntil:
    visible: 'Communities'
    timeout: 10000
- assertVisible: 'Communities'

- tapOn:
    text: 'Chat'
    index: 0
- extendedWaitUntil:
    visible: 'Chats'
    timeout: 10000
- assertVisible: 'Chats'

- tapOn:
    text: 'Profile'
    index: 0
- extendedWaitUntil:
    visible: 'Profile'
    timeout: 10000
- assertVisible: 'Profile'

- tapOn:
    text: 'Home'
    index: 0
- extendedWaitUntil:
    visible: 'Discover'
    timeout: 10000
- assertVisible: 'Discover'
